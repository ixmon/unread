# Build dist/ with scripts/build_site.sh (stdlib Python; data/ is committed, web/data is only a
# local symlink) and publish it to GitHub Pages: https://ixmon.github.io/unread/
# One-time repo setting: Settings → Pages → Source = "GitHub Actions"
#   (or: gh api -X POST repos/ixmon/unread/pages -f build_type=workflow)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build dist/
        run: ./scripts/build_site.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
