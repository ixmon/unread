<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Mockup B · Linked timeline histogram · Unread Atlas</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="common.css" />
<style>
body{display:flex;flex-direction:column;height:100vh}
#map{flex:1;position:relative}
.searchbox{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:1001;display:flex;gap:6px;align-items:center;padding:5px 5px 5px 14px;border-radius:999px;width:min(480px,calc(100vw - 360px))}
.searchbox input{flex:1;background:transparent;border:0;outline:0;font-size:15px}
.searchbox .btn{border-radius:999px}
.readout{position:absolute;top:66px;left:50%;transform:translateX(-50%);z-index:1001;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#strip{height:210px;background:var(--bg-elev);border-top:1px solid var(--border);position:relative;user-select:none}
#strip svg{display:block;width:100%;height:100%}
.bar{fill:#3a4250}.bar.in{fill:var(--accent)}.ghost{fill:#262c36}
.axis text{fill:var(--text-faint);font-size:10.5px;font-family:var(--font-ui)}
.axis line{stroke:var(--border)}
.brush{fill:rgba(224,149,96,.12);stroke:var(--accent-strong);stroke-width:1}
.stripinfo{position:absolute;top:8px;left:14px;font-size:12px;color:var(--text-dim);pointer-events:none}
.stripinfo b{color:var(--text)}
.striphelp{position:absolute;top:26px;left:14px;font-size:11.5px;color:var(--text-faint)}
.striphelp a{cursor:pointer}
.plabel{fill:var(--text-dim);font-size:10px}
</style>
</head>
<body>
<div id="map">
  <div class="brand"><a href="./">Unread Atlas</a><small>Mockup B · map + timeline</small></div>
  <form class="searchbox panel" id="f"><input id="q" placeholder="Search…" /><button class="btn primary">Search</button></form>
  <div class="readout" id="readout"></div>
</div>
<div id="strip">
  <div class="stripinfo" id="sinfo"></div>
  <div class="striphelp">Drag across the bars to pick a time window · pan/zoom the map to pick a region · <a id="clr">clear window</a></div>
  <svg id="svg"></svg>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="common.js"></script>
<script>
(() => {
  const { api, esc, fmt, short, siteName, initMap, radius, periodRange, yr, qs } = MU;
  const $ = (s) => document.querySelector(s);
  const map = initMap("map");
  const layer = L.layerGroup().addTo(map);
  const Y0 = -3400, Y1 = 0, STEP = 100, NB = (Y1 - Y0) / STEP;
  let data = null, sites = [], brush = null; // brush = [y0, y1]
  const fromQ = Number(qs.get("from")), toQ = Number(qs.get("to"));
  if (qs.get("from") && qs.get("to")) brush = [Math.min(fromQ, toQ), Math.max(fromQ, toQ)];
  $("#q").value = qs.get("q") || "barley";

  // Spread each period's count evenly over its conventional date range, per century (an approximation: the API knows
  // periods, not years). Periods with no known range are counted as "undated".
  function vectorFor(periods) {
    const v = new Float64Array(NB); let undated = 0;
    for (const [p, n] of periods) {
      const r = periodRange(p);
      if (!r) { undated += n; continue; }
      const [a, b] = r, len = Math.max(1, b - a);
      for (let i = 0; i < NB; i++) {
        const c0 = Y0 + i * STEP, c1 = c0 + STEP, ov = Math.min(b, c1) - Math.max(a, c0);
        if (ov > 0) v[i] += (n * ov) / len;
      }
    }
    return { v, undated };
  }
  const inWin = (i) => !brush || (Y0 + i * STEP < brush[1] && Y0 + (i + 1) * STEP > brush[0]);
  function selCount(s) { let t = 0; for (let i = 0; i < NB; i++) if (inWin(i)) t += s.vec[i]; return t; }

  async function run() {
    const q = $("#q").value.trim(); if (!q) return;
    $("#readout").innerHTML = `<span class="chip"><span class="spinner"></span> Searching…</span>`;
    data = await api("/search/sites?" + new URLSearchParams({ q, in: "all" }), (m) => ($("#readout").innerHTML = `<span class="chip"><span class="spinner"></span> ${esc(m)}</span>`));
    sites = data.sites.map((s) => { const { v, undated } = vectorFor(s.periods); return { ...s, vec: v, undated }; });
    const p = new URLSearchParams(location.search); p.set("q", q); history.replaceState(null, "", "?" + p);
    if (!qs.get("view")) map.fitBounds(sites.map((s) => [s.lat, s.lon]), { padding: [60, 60], maxZoom: 6 });
    update();
  }
  function update() {
    if (!data) return;
    const b = map.getBounds();
    const inView = sites.filter((s) => b.contains([s.lat, s.lon]));
    // map dots: tablets in the brushed window
    layer.clearLayers();
    let selTot = 0, selSites = 0;
    for (const s of sites) {
      const n = selCount(s);
      if (n < 0.5) continue;
      if (b.contains([s.lat, s.lon])) { selTot += n; selSites++; }
      L.circleMarker([s.lat, s.lon], { radius: radius(n), color: "#f2c9a6", weight: 1, fillColor: "#c4784a", fillOpacity: 0.55 })
        .bindTooltip(`${esc(siteName(s.site))}: ~${fmt(n)}${brush ? " in window" : ""} (of ${fmt(s.count)})`).addTo(layer);
    }
    // bars: all results (ghost) vs results in current map view (solid)
    const all = new Float64Array(NB), view = new Float64Array(NB); let undView = 0;
    for (const s of sites) for (let i = 0; i < NB; i++) all[i] += s.vec[i];
    for (const s of inView) { for (let i = 0; i < NB; i++) view[i] += s.vec[i]; undView += s.undated; }
    drawBars(all, view);
    const viewTot = inView.reduce((a, s) => a + s.count, 0);
    $("#readout").innerHTML = `<span class="chip">“${esc(data.q)}”: <b>${fmt(data.total)}</b> tablets · <b>${fmt(data.site_count)}</b> sites · ${fmt(data.unlocated)} unlocated</span>` +
      `<span class="chip">In view: <b>${fmt(viewTot)}</b> at ${inView.length} sites</span>` +
      (brush ? `<span class="chip">Window ${yr(brush[0])}–${yr(brush[1])}: <b>≈${fmt(selTot)}</b> at ${selSites} sites in view</span>` : "");
    $("#sinfo").innerHTML = `Matches per century, ${yr(Y0)}–${yr(Y1)} · <b style="color:var(--accent-strong)">■</b> in map view · <span style="color:#5a6270">■</span> all results · ${fmt(undView)} in view have no datable period · <span class="faint">period counts spread evenly over each period's conventional dates (approximate)</span>`;
  }
  const svg = $("#svg");
  const PADL = 48, PADR = 16, PADT = 52, PADB = 34;
  const X = (y) => PADL + ((y - Y0) / (Y1 - Y0)) * (svg.clientWidth - PADL - PADR);
  const Yinv = (x) => Y0 + ((x - PADL) / (svg.clientWidth - PADL - PADR)) * (Y1 - Y0);
  const ERAS = [["Uruk", -3400, -2900], ["Early Dyn.", -2900, -2334], ["Akkad", -2334, -2154], ["Ur III", -2112, -2004], ["Old Bab./Ass.", -2004, -1595], ["Middle Bab./Ass.", -1595, -1000], ["Neo-Ass.", -911, -612], ["Neo-Bab.", -626, -539], ["Achaemenid", -539, -331], ["Hellenistic", -331, -63]];
  function drawBars(all, view) {
    const W = svg.clientWidth, H = svg.clientHeight, h = H - PADT - PADB;
    const max = Math.max(1, ...all);
    const sc = (n) => (Math.sqrt(n) / Math.sqrt(max)) * h; // sqrt scale so small periods stay visible
    let s = "";
    for (let i = 0; i < NB; i++) {
      const x0 = X(Y0 + i * STEP) + 1, w = X(Y0 + (i + 1) * STEP) - x0 - 1;
      s += `<rect class="ghost" x="${x0}" y="${PADT + h - sc(all[i])}" width="${w}" height="${sc(all[i])}"><title>${yr(Y0 + i * STEP)}–${yr(Y0 + (i + 1) * STEP)}: ≈${fmt(all[i])} all · ≈${fmt(view[i])} in view</title></rect>`;
      s += `<rect class="bar ${inWin(i) && brush ? "in" : brush ? "" : "in"}" x="${x0}" y="${PADT + h - sc(view[i])}" width="${w}" height="${sc(view[i])}" pointer-events="none"/>`;
      if (view[i] >= max * 0.02 && w > 18) s += `<text class="plabel" x="${x0 + w / 2}" y="${PADT + h - sc(view[i]) - 3}" text-anchor="middle">${short(view[i])}</text>`;
    }
    s += `<g class="axis"><line x1="${PADL}" x2="${W - PADR}" y1="${PADT + h}" y2="${PADT + h}"/>`;
    for (let y = Y0; y <= Y1; y += 500) s += `<text x="${X(y)}" y="${PADT + h + 13}" text-anchor="middle">${y ? -y + " BCE" : "0"}</text>`;
    for (const [n, a, b] of ERAS) s += `<text x="${(X(a) + X(b)) / 2}" y="${PADT + h + 27}" text-anchor="middle" style="fill:#857f73">${n}</text><line x1="${X(a)}" x2="${X(a)}" y1="${PADT + h + 17}" y2="${PADT + h + 30}"/>`;
    s += `</g>`;
    if (brush) s += `<rect class="brush" x="${X(brush[0])}" y="${PADT - 6}" width="${X(brush[1]) - X(brush[0])}" height="${h + 6}"/>`;
    svg.innerHTML = s;
  }
  // brushing
  let drag = null;
  svg.addEventListener("pointerdown", (e) => { const r = svg.getBoundingClientRect(); drag = Yinv(e.clientX - r.left); svg.setPointerCapture(e.pointerId); });
  svg.addEventListener("pointermove", (e) => {
    if (drag == null) return;
    const r = svg.getBoundingClientRect(), y = Yinv(e.clientX - r.left);
    const snap = (v) => Math.max(Y0, Math.min(Y1, Math.round(v / 50) * 50));
    brush = [snap(Math.min(drag, y)), snap(Math.max(drag, y))];
    if (brush[1] - brush[0] < 50) brush = null;
    update();
  });
  svg.addEventListener("pointerup", () => {
    drag = null;
    const p = new URLSearchParams(location.search);
    if (brush) { p.set("from", brush[0]); p.set("to", brush[1]); } else { p.delete("from"); p.delete("to"); }
    history.replaceState(null, "", "?" + p);
  });
  $("#clr").onclick = () => { brush = null; update(); };
  map.on("moveend", update);
  window.addEventListener("resize", update);
  $("#f").onsubmit = (e) => { e.preventDefault(); run(); };
  run();
})();
</script>
</body>
</html>
