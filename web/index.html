<style>
:root{--clay:#c4784a;--clay2:#e09560;--lapis:#2f5fa8;--lapis2:#5b8ad6;--gold:#e3c27a;--ink:#0b0d12;--sky:#9fd0ff;--sky2:#6fb4f2}
html,body{height:auto;overflow-x:hidden;background:var(--ink)}
#hero{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;background:var(--ink) url(assets/hero-poster.jpg) center/cover no-repeat}
#hero.live{background-image:none}
#bg,#gl,#ov{position:absolute;inset:0;width:100%;height:100%}
#bg,#ov{pointer-events:none}
#hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 40%,rgba(11,13,18,.75) 100%),linear-gradient(to bottom,rgba(11,13,18,0) 70%,var(--ink) 100%)}
#brand{position:absolute;top:22px;left:28px;z-index:6;font-family:var(--font-serif);font-size:20px;letter-spacing:.06em;color:var(--gold)}
#brand a{color:inherit;display:inline-flex;align-items:center;gap:12px}#brand a:hover{text-decoration:none;color:#fff}#brand img{height:34px;width:auto;display:block}
#topnav{position:absolute;top:24px;right:28px;z-index:6;display:flex;gap:20px;font-size:13px}
#topnav a{color:var(--text-dim)}#topnav a:hover{color:var(--gold);text-decoration:none}
#copy{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(820px,92vw);transition:opacity .8s}
/* soft dim behind the headline so it reads over the dots */
#copy::before{content:"";position:absolute;z-index:-1;left:-8%;right:-8%;top:-22%;bottom:-18%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(8,10,14,.72) 0%,rgba(8,10,14,.5) 45%,rgba(8,10,14,0) 72%);filter:blur(6px);pointer-events:none}
#copy h1{font-family:var(--font-serif);font-weight:500;font-size:clamp(28px,4.4vw,54px);line-height:1.14;margin:0 0 14px;text-shadow:0 2px 18px rgba(0,0,0,.95),0 0 42px rgba(0,0,0,.7)}
#copy h1 em{font-style:normal;color:var(--gold)}
#copy p.tag{font-size:clamp(15px,1.7vw,19px);color:#d8d1c3;margin:0 0 26px;text-shadow:0 1px 12px #000}
#copy p.tag b{color:var(--gold);font-weight:500}
#sform{display:flex;max-width:520px;margin:0 auto;background:rgba(18,20,26,.85);border:1px solid #33404f;border-radius:999px;padding:5px;backdrop-filter:blur(6px);box-shadow:0 10px 40px rgba(0,0,0,.5)}
#sform input{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:10px 18px;font-size:16px;color:var(--text)}
#sform button{background:linear-gradient(135deg,var(--sky),var(--sky2));color:#0b1a2b;border:0;border-radius:999px;padding:10px 22px;font-weight:600;cursor:pointer}
#sform button:hover{filter:brightness(1.08)}
#hints{margin-top:12px;font-size:12.5px;color:var(--text-faint);text-shadow:0 1px 8px #000}#hints a{color:#b9c8d8;margin:0 6px}
/* Keep the search usable: only fade headline/hints when the visitor takes over the hero.
   Hiding all of #copy made the search vanish on phones after a scroll/tap and never return. */
body.user #copy h1, body.user #copy p.tag, body.user #hints{opacity:0;max-height:0;margin:0;overflow:hidden;pointer-events:none;transition:opacity .5s,max-height .5s}
body.user #copy{top:76px;transform:translate(-50%,0)}
body.user #sform{pointer-events:auto;opacity:1}
@media (max-width:640px){
  #sform{position:fixed;left:12px;right:12px;top:58px;z-index:9;max-width:none;margin:0;transition:opacity .25s,transform .25s}
  body.scrolled-down #sform{opacity:0;transform:translateY(-12px);pointer-events:none}
  body.scrolled-top #sform, body:not(.scrolled-down) #sform{opacity:1;transform:none;pointer-events:auto}
  body.user #copy{top:118px}
}
#legend{position:absolute;left:28px;bottom:28px;z-index:6;background:rgba(14,16,21,.78);border:1px solid #2a2e38;border-radius:10px;padding:10px 13px;font-size:12px;line-height:1.7;backdrop-filter:blur(4px);max-width:290px}
#legend:empty{display:none}
#legend .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
#legend .n{color:var(--text-dim);margin-left:6px;font-variant-numeric:tabular-nums}
#maplabel{position:absolute;right:28px;bottom:28px;z-index:6;text-align:right;font-family:var(--font-serif);font-size:20px;color:var(--gold);transition:opacity .5s}
#maplabel small{display:block;font-family:var(--font-ui);font-size:11.5px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase}
#navbar{position:absolute;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:7;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;opacity:0;pointer-events:none;transition:.5s;background:rgba(14,16,21,.88);border:1px solid #2a2e38;border-radius:22px;padding:5px;max-width:94vw}
body.user #navbar{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#navbar button{background:transparent;border:0;color:var(--text-dim);padding:7px 13px;border-radius:999px;cursor:pointer;font-size:13px}
#navbar button.on{background:var(--lapis);color:#fff}
#navbar a{padding:7px 13px;font-size:13px;color:var(--sky)}
body.user #maplabel{bottom:80px}
#scrollcue{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;color:var(--text-faint);font-size:11px;letter-spacing:.2em;text-transform:uppercase;animation:bob 2.4s infinite}
body.user #scrollcue{display:none}
@keyframes bob{50%{transform:translate(-50%,5px)}}
@media (prefers-reduced-motion:reduce){#scrollcue{animation:none}}
main{max-width:1180px;margin:0 auto;padding:30px 28px 40px}
h2{font-family:var(--font-serif);font-weight:500;font-size:28px;margin:46px 0 6px}
.lede{color:var(--text-dim);margin:0 0 22px;max-width:680px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{display:block;background:#14171d;border:1px solid #262a33;border-radius:12px;overflow:hidden;color:var(--text);transition:transform .25s var(--ease),border-color .25s}
a.card:hover{transform:translateY(-3px);border-color:var(--sky2);text-decoration:none}
.card img{display:block;width:100%;height:150px;object-fit:cover;background:#0d0f14;border-bottom:1px solid #222}
.card .b{padding:12px 14px 15px}.card b{font-size:15px;color:var(--gold)}.card p{margin:4px 0 0;color:var(--text-dim);font-size:13px}
.card.soon{opacity:.62}.card.soon img{filter:grayscale(.7) brightness(.7)}
.pill{display:inline-block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lapis2);border:1px solid #2b3d5c;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}#legend{display:none}#topnav{display:none}#maplabel{font-size:16px;bottom:44px}#brand{left:18px;top:18px}}
.panel{background:linear-gradient(160deg,#171a21,#12141a);border:1px solid #262a33;border-radius:12px;padding:20px 22px}
.panel h3{margin:0 0 4px;font-family:var(--font-serif);font-weight:500;font-size:22px}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay2)}
.muted{color:var(--text-dim)}
.atf{font-family:var(--font-mono);font-size:12.5px;background:#0d0f14;border:1px solid #23262e;border-radius:8px;padding:10px 12px;color:#d9cfb8;overflow-x:auto;white-space:nowrap;margin-bottom:14px}
.atf mark{background:rgba(196,120,74,.3);color:#ffd9b8;border-radius:3px;padding:0 2px}
.btn{display:inline-block;background:transparent;border:1px solid var(--sky2);color:var(--sky);border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:500;margin:4px 6px 0 0}
.btn:hover{background:var(--sky2);color:#0b1a2b;text-decoration:none}
.btn.solid{background:var(--lapis);border-color:var(--lapis);color:#fff}
#rt{min-height:120px}
#rt .id{font-family:var(--font-serif);font-size:22px;color:var(--gold)}
.collab{margin-top:46px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;border:1px solid #2b3a4c;background:linear-gradient(120deg,rgba(196,120,74,.10),rgba(47,95,168,.14));border-radius:14px;padding:26px 28px}
@media(max-width:820px){.collab{grid-template-columns:1fr}}
.collab h3{margin:0 0 6px;font-family:var(--font-serif);font-weight:500;font-size:24px}
.here{margin-top:8px}
.here .big{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0 0 14px}
.here .fig{background:#14171d;border:1px solid #262a33;border-radius:12px;padding:14px 16px}
.here .fig b{display:block;font-family:var(--font-serif);font-weight:500;font-size:30px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.15}
.here .fig>span{display:block;color:var(--text-dim);font-size:13.5px;margin-top:4px;line-height:1.4}
.here .fig small{color:var(--text-faint);font-size:12px}
.here .bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0 8px;background:#1b1f27}
.here .bar i{display:block;height:100%}
.here .keys{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--text-dim);margin:0 0 6px}
.here .keys em{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.here .src{color:var(--text-dim);font-size:14px;max-width:820px}
.here .cta{margin-top:10px}
@media(max-width:520px){.here .fig b{font-size:25px}}
footer{color:var(--text-faint);font-size:12px;text-align:center;padding:24px 28px 40px;max-width:900px;margin:0 auto}
footer a{color:var(--text-dim)}
noscript p{position:absolute;bottom:30px;width:100%;text-align:center;z-index:6;color:var(--text-dim)}
</style>
