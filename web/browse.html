<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="ov"></canvas><div id="brush"></div><div id="tip"></div></div>
<div id="top">
  <a href="./" title="Unread Atlas home" style="font-family:'Source Serif 4',Georgia,serif;white-space:nowrap">◂ Unread Atlas</a>
  <input id="q" placeholder="English, ATF (kasz) or 𒁉…" value="barley" title="Type a word and press Enter. English, ATF transliteration (kasz, {u2}tar-musz, š or sz) or cuneiform signs." />
  <span id="mode" title="Search English or ATF; Auto guesses from what you type"><button data-m="auto" class="on">Auto</button><button data-m="en">English</button><button data-m="atf">ATF</button></span>
  <span class="lbl" id="plbl">Try:</span><span id="presets"></span>
  <button id="clearSel" title="Clear selection">clear selection</button>
</div>
<div id="nav"><div id="navlabel"></div><div id="handle"></div></div>
<div id="info">Loading…</div>
<div id="foot" style="position:absolute;left:14px;bottom:12px;z-index:5;font-size:11.5px;color:#888"><a href="map.html">Map</a> · <a href="search.html">Search</a> · <a href="t/index.html">Curated</a> · every tablet is a dot · approximate dates · English = human + machine translations · scroll turns the wheel</div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// ---- data dims: 0 lon, 1 lat, 2 year, 3 genre, 4 translation state
const MAPS = [
  {name:"Geography", sub:"longitude × latitude", x:0, y:1},
  {name:"Time × geography", sub:"longitude × date", x:0, y:2},
  {name:"Time × genre", sub:"date × genre", x:2, y:3},
  {name:"Time × translation", sub:"date × translation state", x:2, y:4},
  {name:"Genre × translation", sub:"genre × translation state", x:3, y:4},
];
const DIMNAME = ["longitude","latitude","date","genre","translation state"];
const STATE_COL = [[0.36,0.78,0.55],[0.36,0.62,0.95],[0.95,0.62,0.25],[0.85,0.35,0.45]];
const LON=[30,60], LAT=[24,42], YR=[-3600,500];
let D, N, vals, flagsBuf, flags, match=null, sel=new Uint8Array(0), term=null;
let navT = 0; // position around the ring, 0..MAPS.length
const params = new URLSearchParams(location.search);

const gl = document.getElementById('gl').getContext('webgl', {antialias:true, preserveDrawingBuffer:true});
const ov = document.getElementById('ov'), ctx = ov.getContext('2d');
const VS = `
attribute vec4 a0; attribute float a1; attribute vec4 a2;
uniform vec4 wx0; uniform float wx1; uniform vec4 wy0; uniform float wy1;
uniform float geoW, dateW, hasMatch; uniform vec4 pad; uniform float ps;
varying vec4 vCol;
uniform vec3 sc0, sc1, sc2, sc3;
void main(){
  float px = dot(a0, wx0) + a1*wx1;
  float py = dot(a0, wy0) + a1*wy1;
  vec2 p = vec2(pad.x + px*(1.0-pad.x-pad.y), pad.w + py*(1.0-pad.z-pad.w));
  gl_Position = vec4(p*2.0-1.0, 0.0, 1.0);
  float st = a2.w;  // state idx encoded in a2.w? (see JS)
  vec3 c = st < 0.5 ? sc0 : st < 1.5 ? sc1 : st < 2.5 ? sc2 : sc3;
  float vis = mix(1.0, 1.0-geoW, 1.0-a2.x) * mix(1.0, 1.0-dateW, 1.0-a2.y);
  float m = mod(a2.z, 2.0); float s = step(1.5, a2.z);
  float alpha = hasMatch > 0.5 ? (m > 0.5 ? 0.8 : 0.012) : 0.2;
  if (s > 0.5) { c = vec3(1.0, 0.92, 0.45); alpha = 0.95; }
  vCol = vec4(c, alpha*vis);
  gl_PointSize = (s > 0.5 ? ps*1.8 : (hasMatch>0.5 && m>0.5 ? ps*1.25 : ps));
  if (vis < 0.01) gl_PointSize = 0.0;
}`;
const FS = `precision mediump float; varying vec4 vCol;
void main(){ vec2 d = gl_PointCoord-0.5; float r = dot(d,d); if (r>0.25) discard; gl_FragColor = vec4(vCol.rgb*vCol.a, vCol.a); }`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(prog); gl.useProgram(prog);
const U = n => gl.getUniformLocation(prog, n);
STATE_COL.forEach((c,i)=>gl.uniform3fv(U('sc'+i), c));

function hash(i,k){ let x = Math.sin(i*12.9898 + k*78.233)*43758.5453; return x - Math.floor(x); }
function norm(v,[a,b]){ return Math.min(1,Math.max(0,(v-a)/(b-a))); }
function band(idx,n,i,k){ return (idx + 0.12 + 0.76*hash(i,k)) / n; }

// Full corpus: columnar binary (scripts/build_browse_data.py). T.* typed arrays, NaN = unknown.
let T, IDS, IDX, REL = {en:{}, atf:{}}, SIGNS = {};
const API = /(^|\.)unreadatlas\.(com|org)$/.test(location.hostname) ? '/api' : 'https://unreadatlas.com/api';
async function load(){
  const [meta, bin, idtxt] = await Promise.all([
    fetch('assets/browse_meta.json').then(r=>r.json()), fetch('assets/browse_all.dat').then(r=>r.arrayBuffer()), fetch('assets/browse_ids.txt').then(r=>r.text())]);
  fetch('assets/browse_related.json').then(r=>r.json()).then(j=>{ REL=j; showRelated(); }).catch(()=>{});
  fetch('assets/sign_readings.json').then(r=>r.json()).then(j=>{ SIGNS=j; }).catch(()=>{});
  D = meta; N = meta.n; IDS = idtxt.split('\n'); IDX = new Map(IDS.map((id,i)=>[id,i]));
  let o = 0; const col = (C, n) => { const a = new C(bin, o, N); o += N*C.BYTES_PER_ELEMENT; return a; };
  const lonU = col(Uint16Array), latU = col(Uint16Array), yrI = col(Int16Array), gU = col(Uint8Array), sU = col(Uint8Array);
  const siteU = new Uint16Array(bin.slice(o, o + N*2));
  T = {lon:new Float32Array(N), lat:new Float32Array(N), yr:new Float32Array(N), g:gU, s:sU, site:siteU};
  for (let i=0;i<N;i++){ T.lon[i] = lonU[i]===0xFFFF ? NaN : -20 + lonU[i]/65534*100; T.lat[i] = latU[i]===0xFFFF ? NaN : latU[i]/65534*60; T.yr[i] = yrI[i]===-32768 ? NaN : yrI[i]; }
  vals = new Float32Array(N*5);
  const a0 = new Float32Array(N*4), a1 = new Float32Array(N); flags = new Float32Array(N*4);
  const ng = D.genres.length, ns = D.states.length;
  for (let i=0;i<N;i++){
    const lon=T.lon[i], lat=T.lat[i], yr=T.yr[i], g=T.g[i], st=T.s[i];
    const hasGeo = lon===lon, hasDate = yr===yr;
    const v0 = hasGeo? norm(lon + (hash(i,6)-0.5)*0.35*Math.sqrt(hash(i,8)),LON) : 0.5 + (hash(i,1)-0.5)*0.3,
          v1 = hasGeo? norm(lat + (hash(i,7)-0.5)*0.35*Math.sqrt(hash(i,8)),LAT) : 0.5 + (hash(i,2)-0.5)*0.3,
          v2 = hasDate? Math.min(1,Math.max(0, norm(yr,YR) + (hash(i,3)-0.5)*0.025)) : 0.5,
          v3 = band(g,ng,i,4), v4 = band(st,ns,i,5);
    vals[i*5]=v0; vals[i*5+1]=v1; vals[i*5+2]=v2; vals[i*5+3]=v3; vals[i*5+4]=v4;
    a0[i*4]=v0; a0[i*4+1]=v1; a0[i*4+2]=v2; a0[i*4+3]=v3; a1[i]=v4;
    flags[i*4]=hasGeo?1:0; flags[i*4+1]=hasDate?1:0; flags[i*4+3]=st;
  }
  sel = new Uint8Array(N);
  const b = (data, loc, size)=>{ const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf); gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);
    const L=gl.getAttribLocation(prog,loc); gl.enableVertexAttribArray(L); gl.vertexAttribPointer(L,size,gl.FLOAT,false,0,0); return buf; };
  b(a0,'a0',4); b(a1,'a1',1); flagsBuf = b(flags,'a2',4);
  buildNav();
  navT = parseFloat(params.get('t') || '0');
  if (params.get('in')==='en'||params.get('in')==='atf') setMode(params.get('in'));
  const q0 = params.has('q') ? (params.get('q')||'') : 'barley'; q.value = q0;
  addEventListener('resize', draw);
  await setTerm(q0 || null);
  window.__ready = true;
}
const q = document.getElementById('q');
q.addEventListener('keydown', e=>{ if(e.key==='Enter') setTerm(q.value.trim()||null); });
let mode = 'auto', lastScope = 'en', res = null, reqN = 0;
function setMode(m){ mode = m; document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on', b.dataset.m===m)); }
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{ setMode(b.dataset.m); if (q.value.trim()) setTerm(q.value.trim()); });
const CUNEI = /[\u{12000}-\u{1254F}]/u;
const ATF_HINT = /[šŠṣṭḫŋĝ₀-₉{}]|sz|\w-\w|[a-z]\d\b|^\d\(/i;
const toAscii = s => s.toLowerCase().replace(/š/g,'sz').replace(/ṣ/g,'s,').replace(/ṭ/g,'t,').replace(/ḫ/g,'h').replace(/[ŋĝ]/g,'j').replace(/[₀-₉]/g,c=>String(c.charCodeAt(0)-0x2080));
const toPretty = s => s.replace(/sz/g,'š').replace(/SZ/g,'Š').replace(/s,/g,'ṣ').replace(/t,/g,'ṭ');
// cuneiform glyphs -> most common reading, joined with '-' within a word
function glyphsToAtf(s){ return s.split(/\s+/).map(w=>[...w].map(ch=>CUNEI.test(ch) ? ((SIGNS[ch]||[])[0] || '') : ch).filter(Boolean).join(CUNEI.test(w)?'-':'')).join(' ').trim(); }
function detect(t){ if (CUNEI.test(t)) return 'atf'; const a = toAscii(t);
  if (ATF_HINT.test(t)) return 'atf'; if (REL.atf[a] && !REL.en[a.toLowerCase()]) return 'atf'; return 'en'; }
async function setTerm(k){
  const my = ++reqN; term = k; match = null; res = null; let scope = 'en', shown = k;
  if (k) {
    scope = mode==='auto' ? detect(k) : mode;
    if (CUNEI.test(k)) { if (!Object.keys(SIGNS).length) SIGNS = await fetch('assets/sign_readings.json').then(r=>r.json()).catch(()=>({})); shown = glyphsToAtf(k); }
    lastScope = scope; term = shown;
    showStatus(`Searching ${scope==='atf'?'ATF':'English'} for “${esc(shown)}”…`);
    showRelated();
    try {
      const r = await fetch(`${API}/search/ids?q=${encodeURIComponent(scope==='atf'?toAscii(shown):shown.toLowerCase())}&in=${scope}`);
      const j = await r.json(); if (my !== reqN) return;
      if (!r.ok) throw new Error(j.error||r.status);
      match = new Uint8Array(N); let m = 0;
      for (const id of j.ids) { const i = IDX.get(id); if (i!==undefined && !match[i]) { match[i]=1; m++; } }
      res = {total:j.total, shown:m, truncated:j.truncated||j.hits_capped, scope, q:shown, glyph: CUNEI.test(k) ? k : null};
    } catch(e) { if (my !== reqN) return; res = {error:String(e.message||e), scope, q:shown}; }
  } else showRelated();
  const u = new URL(location); if (k) { u.searchParams.set('q', k); u.searchParams.set('in', scope); } else { u.searchParams.delete('q'); u.searchParams.delete('in'); } history.replaceState(null,'',u);
  updFlags(); draw();
}
function showStatus(h){ const el=document.getElementById('info'); if (el) el.innerHTML = h; }
// preset words before a search; afterwards the words that co-occur most with it (NPMI) — "Appears with:"
function showRelated(){
  const pr = document.getElementById('presets'), lbl = document.getElementById('plbl'); pr.innerHTML = '';
  const key = term ? (lastScope==='atf' ? toAscii(term) : term.toLowerCase()) : null;
  const rel = key ? (REL[lastScope]||{})[key] : null;
  const mk = (txt, val, cls) => { const bt=document.createElement('button'); bt.textContent=txt; if(cls) bt.className=cls; bt.onclick=()=>{ q.value=val; setTerm(val); }; pr.appendChild(bt); };
  if (rel && rel.length) { lbl.textContent = 'Appears with:'; rel.slice(0,6).forEach(w=>mk(lastScope==='atf'?toPretty(w):w, lastScope==='atf'?toPretty(w):w, 'rel')); }
  else if (!term) { lbl.textContent = 'Try:'; ['barley','silver','sheep','kaš'].forEach(w=>mk(w,w)); }
  else { lbl.textContent = key && Object.keys(REL.en).length ? 'Try:' : ''; if (lbl.textContent) ['barley','silver','sheep','kaš'].forEach(w=>mk(w,w)); }
  const all=document.createElement('button'); all.textContent='all'; all.title='Show every tablet, no search'; all.onclick=()=>{q.value='';setTerm(null)}; pr.appendChild(all);
}
function updFlags(){
  for(let i=0;i<N;i++) flags[i*4+2] = (match && match[i] ? 1 : 0) + (sel[i] ? 2 : 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, flagsBuf); gl.bufferData(gl.ARRAY_BUFFER, flags, gl.DYNAMIC_DRAW);
}

// ---- blend state from navT
function blend(){
  const n = MAPS.length, t = ((navT % n)+n)%n, i = Math.floor(t), f = t - i, j = (i+1)%n;
  const e = f*f*(3-2*f); // smoothstep
  const wx = [0,0,0,0,0], wy=[0,0,0,0,0];
  wx[MAPS[i].x]+=1-e; wy[MAPS[i].y]+=1-e; wx[MAPS[j].x]+=e; wy[MAPS[j].y]+=e;
  return {i,j,e,wx,wy};
}
const PAD = {l:118,r:30,t:30,b:60};
function draw(){
  if(!D) return;
  const dpr = devicePixelRatio||1, W = innerWidth, H = innerHeight;
  for (const c of [gl.canvas, ov]) { c.width = W*dpr; c.height = H*dpr; }
  gl.viewport(0,0,W*dpr,H*dpr); gl.clearColor(0.06,0.067,0.085,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  const B = blend(); window.__blend = B;
  const geoW = (B.wx[0]+B.wx[1]+B.wy[0]+B.wy[1])/2, dateW = Math.max(B.wx[2], B.wy[2]);
  gl.uniform4f(U('wx0'),B.wx[0],B.wx[1],B.wx[2],B.wx[3]); gl.uniform1f(U('wx1'),B.wx[4]);
  gl.uniform4f(U('wy0'),B.wy[0],B.wy[1],B.wy[2],B.wy[3]); gl.uniform1f(U('wy1'),B.wy[4]);
  // only fully-geographic axes hide unlocated: geo weight = share of both axes that are lon/lat
  gl.uniform1f(U('geoW'), Math.min(1, geoW)); gl.uniform1f(U('dateW'), dateW);
  gl.uniform1f(U('hasMatch'), match?1:0);
  gl.uniform4f(U('pad'), PAD.l/W, PAD.r/W, PAD.t/H, PAD.b/H);
  gl.uniform1f(U('ps'), 2.0*dpr);
  gl.drawArrays(gl.POINTS, 0, N);
  overlay(B, W, H, dpr, geoW, dateW);
  info(B, geoW, dateW);
  updNavUI(B);
}
function axisTicks(dim){
  if (dim===0) return [35,40,45,50,55].map(v=>[norm(v,LON), v+'°E']);
  if (dim===1) return [26,30,34,38,42].map(v=>[norm(v,LAT), v+'°N']);
  if (dim===2) return [-3500,-3000,-2500,-2000,-1500,-1000,-500,0].map(v=>[norm(v,YR), v<0? (-v)+' BCE' : v===0? '1 CE':v+' CE']);
  const L = dim===3 ? D.genres : D.states; return L.map((s,k)=>[(k+0.5)/L.length, s]);
}
function overlay(B,W,H,dpr){
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const X = v => PAD.l + v*(W-PAD.l-PAD.r), Y = v => H - (PAD.b + v*(H-PAD.t-PAD.b));
  ctx.font = '11.5px "IBM Plex Sans", sans-serif';
  for (const [mi, a] of [[B.i, 1-B.e],[B.j, B.e]]) {
    if (a < 0.03) continue; const m = MAPS[mi];
    ctx.globalAlpha = a;
    // x axis: same dim in both maps -> stays put
    ctx.fillStyle='#9aa0ad'; ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.textAlign='center';
    for (const [v,l] of axisTicks(m.x)) { const x=X(v); ctx.fillText(l, x, H-PAD.b+18); if(m.x>2){ } else {ctx.beginPath();ctx.moveTo(x,PAD.t);ctx.lineTo(x,H-PAD.b);ctx.stroke();} }
    ctx.textAlign='right';
    for (const [v,l] of axisTicks(m.y)) { const y=Y(v); ctx.fillText(l, PAD.l-8, y+4); if(m.y<=2){ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(W-PAD.r,y);ctx.stroke();} }
    // band separators for categorical axes
    ctx.strokeStyle='rgba(255,255,255,0.08)';
    if (m.y>2){ const n=(m.y===3?D.genres:D.states).length; for(let k=1;k<n;k++){const y=Y(k/n);ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(W-PAD.r,y);ctx.stroke();} }
    if (m.x>2){ const n=(m.x===3?D.genres:D.states).length; for(let k=1;k<n;k++){const x=X(k/n);ctx.beginPath();ctx.moveTo(x,PAD.t);ctx.lineTo(x,H-PAD.b);ctx.stroke();} }
    ctx.fillStyle='#d8c08a'; ctx.textAlign='center'; ctx.font='12.5px "IBM Plex Sans", sans-serif';
    ctx.fillText(DIMNAME[m.x]+' →', W/2, H-PAD.b+40);
    ctx.save(); ctx.translate(18, H/2); ctx.rotate(-Math.PI/2); ctx.fillText(DIMNAME[m.y]+' →', 0, 0); ctx.restore();
    ctx.font = '11.5px "IBM Plex Sans", sans-serif';
  }
  ctx.globalAlpha = 1;
}
function info(B, geoW, dateW){
  const s = sel.reduce((a,b)=>a+b,0);
  let byState = [0,0,0,0], selState=[0,0,0,0];
  for (let i=0;i<N;i++){ const st=T.s[i]; if(!match||match[i]) byState[st]++; if(sel[i]) selState[st]++; }
  const label = B.e<0.02 ? MAPS[B.i].name : B.e>0.98 ? MAPS[B.j].name : `${MAPS[B.i].name} → ${MAPS[B.j].name} (${Math.round(B.e*100)}%)`;
  const where = r => r.scope==='atf' ? 'ATF transliteration contains' : 'English mentions';
  let head;
  if (res && res.error) head = `Search for “${esc(res.q)}” failed (${esc(res.error)}). <a href="search.html?q=${encodeURIComponent(res.q)}">Try the search page →</a>`;
  else if (res) head = `<b>${res.total.toLocaleString()}</b> tablets whose ${where(res)} “${esc(res.scope==='atf'?toPretty(res.q):res.q)}”${res.glyph?` (from ${esc(res.glyph)}; other readings: ${esc([...res.glyph].filter(c=>CUNEI.test(c)).map(c=>(SIGNS[c]||[]).slice(1).join(', ')).join(' / ')||'none')})`:''}`+
      (res.shown!==res.total || res.truncated ? ` (<b>${res.shown.toLocaleString()}</b> shown${res.truncated?'; list capped at 50,000':''})` : '')+
      (res.total ? ` · <a href="search.html?q=${encodeURIComponent(res.q)}&in=${res.scope}">read them →</a>` : '');
  else head = term ? 'Searching…' : 'All tablets';
  document.getElementById('info').innerHTML =
   `<b>${label}</b><br>${head} · ${N.toLocaleString()} dots, every tablet in the corpus<br>`+
   D.states.map((n,k)=>`<span class="sw" style="background:rgb(${STATE_COL[k].map(c=>c*255|0)})"></span>${n} ${byState[k].toLocaleString()}`).join('')+
   (s? `<br><span style="color:#ffe873">● ${s.toLocaleString()} selected</span> — ${D.states.map((n,k)=>`${n.split(' ')[0]} ${selState[k]}`).join(' · ')}` : '<br><span class="muted">Click a dot or shift-drag to select; the selection travels with you.</span>')+
   (geoW<0.99 ? '' : '<br><span class="muted">Tablets without a find-spot are hidden here; slide away from Geography to see them.</span>');
}

// ---- navigator ring
const nav = document.getElementById('nav'), handle = document.getElementById('handle');
const R = 112, CX = 150, CY = 150;
function nodePos(k){ const a = -Math.PI/2 + k/MAPS.length*2*Math.PI; return [CX+R*Math.cos(a), CY+R*Math.sin(a)]; }
function buildNav(){
  MAPS.forEach((m,k)=>{
    const d = document.createElement('div'); d.className='node'; const [x,y]=nodePos(k); d.style.left=x+'px'; d.style.top=y+'px';
    const c = document.createElement('canvas'); c.width=120; c.height=68; d.appendChild(c); d.appendChild(document.createTextNode(m.name));
    d.onclick = e=>{ e.stopPropagation(); animateTo(k); };
    nav.appendChild(d); m.el=d; thumb(c, m);
  });
}
function thumb(c, m){ // tiny CPU scatter of a subsample
  const x = c.getContext('2d'); x.fillStyle='#0d0f14'; x.fillRect(0,0,120,68);
  for (let i=0;i<N;i+=61){ if ((m.x<2||m.y<2) && !(T.lon[i]===T.lon[i])) continue; if ((m.x==2||m.y==2) && !(T.yr[i]===T.yr[i])) continue;
    const c0=STATE_COL[T.s[i]]; x.fillStyle=`rgba(${c0[0]*255|0},${c0[1]*255|0},${c0[2]*255|0},0.5)`;
    x.fillRect(4+vals[i*5+m.x]*112, 64-vals[i*5+m.y]*60, 1.2,1.2); }
}
function updNavUI(B){
  // handle sits on the arc between the two nodes
  const n=MAPS.length, a = -Math.PI/2 + (((navT%n)+n)%n)/n*2*Math.PI;
  handle.style.left = (CX+R*Math.cos(a))+'px'; handle.style.top=(CY+R*Math.sin(a))+'px';
  MAPS.forEach((m,k)=>m.el.classList.toggle('act', (k===B.i && B.e<0.5) || (k===B.j && B.e>=0.5)));
  document.getElementById('navlabel').innerHTML = 'map of maps<small>drag the ring or scroll</small>';
}
let dragging=false;
function navFromEvent(e){ const r=nav.getBoundingClientRect(); const dx=e.clientX-r.left-CX, dy=e.clientY-r.top-CY;
  let a = Math.atan2(dy,dx)+Math.PI/2; if(a<0)a+=2*Math.PI; return a/(2*Math.PI)*MAPS.length; }
nav.addEventListener('pointerdown', e=>{ if(e.target.closest('.node')) return; dragging=true; nav.setPointerCapture(e.pointerId); navT=navFromEvent(e); draw(); });
nav.addEventListener('pointermove', e=>{ if(!dragging) return; navT=navFromEvent(e); draw(); });
nav.addEventListener('pointerup', ()=>{ dragging=false; });
let animId = 0;
function animateTo(k, durMs){ const n=MAPS.length; let from=navT, d=((k-from)%n+n)%n; if(d>n/2) d-=n; const t0=performance.now(), dur=durMs||900+Math.abs(d)*250, my=++animId;
  (function step(now){ if (my!==animId) return; const f=Math.min(1,(now-t0)/dur), e=durMs? 1-(1-f)**3 : f; navT=from+d*e; draw(); if(f<1) requestAnimationFrame(step); else { navT=((k%n)+n)%n; draw(); } })(t0); }
// ---- scroll / trackpad / touch swipe turns the wheel: momentum, then snaps to the nearest map when idle
let vel = 0, spinning = false, lastInput = 0;
function spin(){ spinning = true; animId++;
  (function step(){ navT += vel; vel *= 0.88; draw();
    if (Math.abs(vel) > 0.0015 || performance.now()-lastInput < 120) requestAnimationFrame(step);
    else { spinning = false; vel = 0; animateTo(Math.round(navT), 420); } })(); }
function nudge(d){ vel += d; vel = Math.max(-0.12, Math.min(0.12, vel)); lastInput = performance.now(); if (!spinning) spin(); }
addEventListener('wheel', e=>{ if (e.target.closest && e.target.closest('#top,#info')) return; e.preventDefault();
  const px = (Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX) * (e.deltaMode===1 ? 16 : e.deltaMode===2 ? 400 : 1);
  nudge(px * 0.00035); }, {passive:false});
let swipe = null;
window.setNav = t => { navT=t; draw(); };

// ---- picking & brushing (CPU, same blend as shader)
function screenPos(i,B,W,H){ let px=0,py=0; for(let k=0;k<5;k++){ px+=vals[i*5+k]*B.wx[k]; py+=vals[i*5+k]*B.wy[k]; }
  return [PAD.l+px*(W-PAD.l-PAD.r), H-(PAD.b+py*(H-PAD.t-PAD.b))]; }
function visible(i,B){ const geoW=(B.wx[0]+B.wx[1]+B.wy[0]+B.wy[1])/2, dateW=Math.max(B.wx[2],B.wy[2]);
  return (T.lon[i]===T.lon[i] || geoW<0.9) && (T.yr[i]===T.yr[i] || dateW<0.9) && (!match || match[i]); }
const stage = document.getElementById('gl'), brush=document.getElementById('brush'), tip=document.getElementById('tip');
let bStart=null, pendingPick=false;
stage.addEventListener('pointerdown', e=>{ if (e.pointerType==='touch') { swipe=[e.clientX,e.clientY,e.clientX,performance.now(),false]; } bStart=[e.clientX,e.clientY,e.shiftKey]; });
stage.addEventListener('pointermove', e=>{
  if (swipe && e.pointerType==='touch') { const dx=e.clientX-swipe[2]; if (Math.abs(e.clientX-swipe[0])>12) swipe[4]=true; if (swipe[4]) { navT -= dx/innerWidth*1.6; vel = -dx/innerWidth*0.5; swipe[2]=e.clientX; animId++; draw(); } return; }
  if (!bStart && pendingPick) return; if (!bStart) { pendingPick = true; requestAnimationFrame(()=>pendingPick=false); }
  if(bStart && bStart[2]){ const [x0,y0]=bStart; Object.assign(brush.style,{display:'block',left:Math.min(x0,e.clientX)+'px',top:Math.min(y0,e.clientY)+'px',width:Math.abs(e.clientX-x0)+'px',height:Math.abs(e.clientY-y0)+'px'}); return; }
  const i = pick(e.clientX,e.clientY); if(i<0){tip.style.display='none';return;}
  tip.style.display='block'; tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY+12)+'px';
  const yr=T.yr[i]; tip.innerHTML=`<b>${esc(IDS[i])}</b><br>${T.site[i]!==0xFFFF?esc(D.sites[T.site[i]]):'no find-spot'} · ${!(yr===yr)?'undated':(yr<0?(-yr)+' BCE':yr+' CE')+' (approx.)'}<br>${D.genres[T.g[i]]} · ${D.states[T.s[i]]}`;
});
stage.addEventListener('pointerup', e=>{
  if (swipe && swipe[4]) { swipe=null; bStart=null; lastInput=0; if (!spinning) spin(); return; } swipe=null;
  if(!bStart) return; const [x0,y0,sh]=bStart; bStart=null; brush.style.display='none';
  const B=blend(), W=innerWidth, H=innerHeight;
  if (sh && Math.abs(e.clientX-x0)+Math.abs(e.clientY-y0)>6){
    const [xa,xb]=[Math.min(x0,e.clientX),Math.max(x0,e.clientX)], [ya,yb]=[Math.min(y0,e.clientY),Math.max(y0,e.clientY)];
    for(let i=0;i<N;i++){ if(!visible(i,B)) continue; const [x,y]=screenPos(i,B,W,H); if(x>=xa&&x<=xb&&y>=ya&&y<=yb) sel[i]=1; }
  } else { const i=pick(e.clientX,e.clientY); if(i>=0) sel[i]^=1; }
  updFlags(); draw();
});
function pick(cx,cy){ const B=blend(), W=innerWidth, H=innerHeight; let best=-1, bd=36;
  for(let i=0;i<N;i++){ if(!visible(i,B)) continue; const [x,y]=screenPos(i,B,W,H); const d=(x-cx)**2+(y-cy)**2; if(d<bd){bd=d;best=i;} } return best; }
window.selectWhere = f => { for(let i=0;i<N;i++) if((!match||match[i]) && f({id:IDS[i],lon:T.lon[i],lat:T.lat[i],year:T.yr[i],genre:T.g[i],state:T.s[i]})) sel[i]=1; updFlags(); draw(); };
document.getElementById('clearSel').onclick=()=>{ sel.fill(0); updFlags(); draw(); };
load();
</script>
</body>
</html>
